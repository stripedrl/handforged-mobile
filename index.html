<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HANDFORGED">
<meta name="theme-color" content="#14101c">
<title>HANDFORGED</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #14101c; height: 100%; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
               overscroll-behavior: none; }
  /* THE FRAME (see tools/build_mobile.py, THE ASPECT GUARD + THE SCREEN FILL).
     Pinned to the whole viewport here, and then RESIZED IN JS once the chosen
     canvas's aspect is known — on a phone the script leaves it exactly as this
     stylesheet has it (full bleed), on a tablet it centres a correctly-shaped
     box and the page's own black becomes the letterbox. Sized in %, not vh:
     iOS's vh lies about the standalone viewport and dvh is newer than some of
     the phones this has to run on. NO safe-area padding — the game IS the
     screen on the devices that fill it. */
  #game { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          margin: 0; padding: 0; overflow: hidden; }
  /* AND THE CANVAS FILLS THE FRAME, both axes, non-uniform allowed.
     !important because Phaser's ScaleManager writes width/height/margin INLINE
     on every refresh and an author !important rule outranks an inline
     declaration — so these four lines own the presentation outright. Input is
     unaffected: Phaser re-derives canvasBounds AND displayScale from the
     canvas's real getBoundingClientRect(), never from what FIT wanted, and a
     letterboxed canvas's rect carries the centring offset with it. */
  canvas { width: 100% !important; height: 100% !important;
           max-width: none !important; max-height: none !important;
           margin: 0 !important; display: block !important; }
  /* THE CURTAIN: landscape is the game; portrait is a polite request. */
  #rotate { display: none; position: fixed; inset: 0; z-index: 99; background: #14101c;
            color: #e8d3a4; font-family: Alata, sans-serif; text-align: center;
            align-items: center; justify-content: center; flex-direction: column; }
  #rotate .big { font-size: 42px; margin-bottom: 12px; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
<script>window.__HF_MOBILE = true;</script>
<script>
/* THE ASPECT GUARD (see tools/build_mobile.py). Runs BEFORE src/config.js,
   because a module script is deferred by spec and this one is not — so
   __HF_WIDE is on the window by the time GAME_W is computed off it. */

(function () {
  var WIDE_W = 2340, NARROW_W = 1920, H = 1080;
  var A_WIDE = WIDE_W / H, A_NARROW = NARROW_W / H;
  /* Whichever canvas the screen is CLOSER to: the midpoint of the two aspects. */
  var PICK = (A_WIDE + A_NARROW) / 2;
  var TOL = 0.06;

  /* Orientation-agnostic on purpose: the page can very easily be evaluated
     while the device is still held upright, and a boot-time decision that
     flips with the wrist is not a decision. */
  var w0 = window.innerWidth || (screen && screen.width) || 0;
  var h0 = window.innerHeight || (screen && screen.height) || 0;
  var a0 = (w0 > 0 && h0 > 0) ? Math.max(w0, h0) / Math.min(w0, h0) : A_WIDE;
  var wide = a0 >= PICK;

  window.__HF_WIDE = wide;
  window.__HF_CANVAS = { w: wide ? WIDE_W : NARROW_W, h: H };
  window.__HF_FILL_TOLERANCE = TOL;

  /* Size the FRAME. The canvas is 100%x100% of it (see the stylesheet), so this
     one function is the whole presentation policy. */
  function fit() {
    var el = document.getElementById('game');
    if (!el) return null;
    var vw = window.innerWidth, vh = window.innerHeight;
    var ca = window.__HF_CANVAS.w / window.__HF_CANVAS.h;
    var sa = vh > 0 ? vw / vh : ca;
    var bw, bh, mode;
    if (Math.abs(sa / ca - 1) <= TOL) {
      /* Close enough to be the same shape: take the whole screen. */
      bw = vw; bh = vh; mode = 'fill';
    } else if (sa > ca) {
      bh = vh; bw = Math.round(vh * ca); mode = 'pillarbox';
    } else {
      bw = vw; bh = Math.round(vw / ca); mode = 'letterbox';
    }
    el.style.width = bw + 'px';
    el.style.height = bh + 'px';
    el.style.left = Math.round((vw - bw) / 2) + 'px';
    el.style.top = Math.round((vh - bh) / 2) + 'px';
    window.__HF_FIT = {
      mode: mode, w: bw, h: bh, left: Math.round((vw - bw) / 2),
      top: Math.round((vh - bh) / 2), vw: vw, vh: vh,
      canvasAspect: ca, screenAspect: sa, wide: wide,
      warp: (bw / bh) / ca
    };
    /* The picture is right the instant CSS lands; the POINTER arithmetic is
       only re-derived inside ScaleManager.refresh(), and a frame it never
       measured is a frame whose taps land somewhere else. */
    var g = window.__game;
    if (g && g.scale) { try { g.scale.refresh(); } catch (e) { /* not up yet */ } }
    return window.__HF_FIT;
  }
  window.__hfFit = fit;
  if (document.readyState !== 'loading') fit();
  else addEventListener('DOMContentLoaded', fit);
})();

</script>
<script>
/* THE MOBILE AUDIO RATE (see tools/build_mobile.py, THE MOBILE AUDIO DIET).

   Every audio file in this package is mono at 24000 Hz, but decodeAudioData
   RESAMPLES to the AudioContext's rate, so a 48kHz context would decode these
   thin files straight back into fat buffers and the whole exercise would show
   up as a smaller download and not one byte less memory. Phaser builds its
   context with a bare `new AudioContext()` and offers no rate config, so the
   constructor is what we reach: same object, same prototype, one option added.

   Every failure mode falls back to the browser's own context and a game that
   merely uses more memory: a device that refuses the rate throws out of the
   inner `new` and is caught; a browser that ignores the option (Safari before
   14.5) simply decodes at its hardware rate as it always did. Read the truth
   back at runtime with `__hfAudioMem().contextRate`. */
(function () {
  var Native = window.AudioContext || window.webkitAudioContext;
  if (!Native) return;
  function Patched(opts) {
    var o = {};
    for (var k in opts) { if (Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k]; }
    o.sampleRate = 24000;
    try { return new Native(o); } catch (e) { return new Native(opts); }
  }
  Patched.prototype = Native.prototype;
  window.AudioContext = Patched;
  if (window.webkitAudioContext) window.webkitAudioContext = Patched;
})();
</script>
<script src="vendor/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div class="big">&#x1F4F1;&#x21BB;</div><div>ROTATE YOUR PHONE<br>HANDFORGED plays sideways</div></div>
<script type="module" src="src/main.js"></script>
<script>
  /* ROTATION, AND THE TWO THINGS A STYLESHEET CANNOT DO.
     (1) The FRAME has to be re-measured against the new viewport — on a
     letterboxing device the bars change size and side on every rotation. (2)
     The POINTER arithmetic is only re-derived inside ScaleManager.refresh(),
     and a frame it never measured is a frame whose taps land somewhere else.
     __hfFit does both, so every event that can change the frame calls it,
     debounced past the end of iOS's rotation animation. */
  (function () {
    var t = null;
    function nudge() {
      clearTimeout(t);
      t = setTimeout(function () {
        if (window.__hfFit) { try { window.__hfFit(); } catch (e) { /* not up yet */ } }
      }, 140);
    }
    addEventListener('resize', nudge);
    addEventListener('orientationchange', nudge);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', nudge);
  })();
</script>
<script>
  /* Shell-only service worker: it makes the game installable and does nothing
     else. Registration failing (file://, http on a non-localhost host, a
     browser that refuses) must never cost anybody the game, so it is fired
     after load and its rejection is swallowed. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
